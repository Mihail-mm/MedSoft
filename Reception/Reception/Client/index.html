<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистратура</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .patient-list { margin-top: 20px; border-top: 1px solid #ddd; padding-top: 20px; }
        .patient-item { padding: 10px; border: 1px solid #ddd; margin-bottom: 10px; border-radius: 4px; }
        .error { color: red; margin-top: 10px; }
        .success { color: green; margin-top: 10px; }
        .form-patients { margin-top: 20px; border-top: 1px solid #ddd; padding-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Регистратура</h1>

    <div class="form-group">
        <label for="name">Имя:</label>
        <input type="text" id="name" required>
    </div>

    <div class="form-group">
        <label for="surname">Фамилия:</label>
        <input type="text" id="surname" required>
    </div>

    <div class="form-group">
        <label for="birthdate">Дата рождения:</label>
        <input type="date" id="birthdate" required>
    </div>

    <button onclick="addPatient()">Добавить пациента</button>

    <div id="message"></div>
    
    <div class="form-patients">
        <h2>Поиск пациентов</h2>
    </div>

    <div class="form-group">
        <label for="name">Имя:</label>
        <input type="text" id="search-name" required>
    </div>

    <div class="form-group">
        <label for="surname">Фамилия:</label>
        <input type="text" id="search-surname" required>
    </div>

    <button onclick="searchPatients()">Найти пациента</button>

    <div class="form-patients">
        <div id="found-patient"></div>
    </div>
</div>

<script src="reception.js"></script>
</body>
</html>
